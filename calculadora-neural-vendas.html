<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Custos Neural Vendas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
        }
        .input-group {
            margin: 15px 0;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        select, input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>Calculadora de Custos Neural Vendas</h1>
    
    <div class="input-group">
        <label for="model">Modelo:</label>
        <select id="model">
            <option value="gpt-4o">GPT-4o</option>
            <option value="gpt-4o-mini">GPT-4o-mini</option>
        </select>
    </div>

    <div class="input-group">
        <label for="plan">Plano:</label>
        <select id="plan">
            <option value="essentials">Essentials (8 créditos - $249)</option>
            <option value="standard">Standard (24 créditos - $498)</option>
        </select>
    </div>

    <div class="input-group">
        <label for="tokens">Tokens por mês (em milhões):</label>
        <input type="number" id="tokens" step="0.1" min="0">
    </div>

    <button onclick="calculate()">Calcular</button>

    <div id="result"></div>

    <script>
        const costs = {
            'gpt-4o': {
                input: 2.50,
                cached: 1.25,
                output: 10.00
            },
            'gpt-4o-mini': {
                input: 0.150,
                cached: 0.075,
                output: 0.600
            }
        };

        const plans = {
            'essentials': {
                credits: 8,
                price: 249
            },
            'standard': {
                credits: 24,
                price: 498
            }
        };

        function calculate() {
            const model = document.getElementById('model').value;
            const plan = document.getElementById('plan').value;
            const tokens = parseFloat(document.getElementById('tokens').value);

            if (!tokens || tokens <= 0) {
                document.getElementById('result').innerHTML = 'Por favor, insira um valor válido de tokens';
                return;
            }

            // Assumindo uma distribuição típica de 75% input e 25% output
            const inputTokens = tokens * 0.75;
            const outputTokens = tokens * 0.25;

            // Cálculo dos custos
            const modelCosts = costs[model];
            const inputCost = inputTokens * modelCosts.input;
            const cachedCost = inputTokens * modelCosts.cached;  // Assumindo mesmo volume para cached
            const outputCost = outputTokens * modelCosts.output;
            const totalCost = inputCost + outputCost;  // Custo sem cache
            
            // Créditos do plano
            const planCredits = plans[plan].credits;
            const planPrice = plans[plan].price;
            const remainingCredits = planCredits - totalCost;

            // Resultado
            let result = `
                <h3>Resultado:</h3>
                <p>Modelo: ${model}</p>
                <p>Plano: ${plan} ($${planPrice} por ${planCredits} créditos)</p>
                <p>Total de tokens: ${tokens}M</p>
                <p>Custo de Input (75%): $${inputCost.toFixed(2)}</p>
                <p>Custo de Output (25%): $${outputCost.toFixed(2)}</p>
                <p>Custo Total: $${totalCost.toFixed(2)}</p>
                <p>Custo com Cache: $${(cachedCost + outputCost).toFixed(2)}</p>
                <p>Créditos Restantes: ${remainingCredits.toFixed(2)}</p>
            `;

            if (remainingCredits < 0) {
                result += `<p style="color: red">Atenção: Você precisará de $${Math.abs(remainingCredits).toFixed(2)} adicionais</p>`;
            }

            document.getElementById('result').innerHTML = result;
        }
    </script>
</body>
</html>
